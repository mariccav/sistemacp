<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colaborativo | Cavalcante Pinheiro</title>
<script src="/auth.js"></script>
<script src="/db-client.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --verde:#1f3e3c;--verde-escuro:#152a28;--verde-medio:#2d5552;--verde-claro:#4a8b86;
  --bege:#a7a897;--bege-claro:#d4d4c8;--bege-fundo:#f0ede6;
  --fundo:#f2fdff;--branco:#ffffff;
  --texto:#1a1a1a;--texto-suave:#5a6060;--texto-muito-suave:#8a9090;
  --erro:#c0392b;--aviso:#d4870a;--sucesso:#2d7a5a;
  --sombra:0 2px 12px rgba(31,62,60,.10);--sombra-forte:0 8px 32px rgba(31,62,60,.18);
  --radius:10px;--radius-lg:16px;
}
html,body{height:100%;font-family:'Nunito',sans-serif;background:var(--fundo);color:var(--texto);overflow:hidden;}

/* ── LAYOUT ── */
#app{display:flex;flex-direction:column;height:100vh;}

/* ── TOPBAR ── */
#topbar{
  display:flex;align-items:center;gap:12px;padding:0 20px;height:56px;
  background:var(--verde);color:#fff;flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}
#topbar img{height:32px;filter:brightness(0) invert(1);opacity:.9;}
#topbar .sep{width:1px;height:24px;background:rgba(255,255,255,.2);}
#topbar .title{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:500;letter-spacing:.02em;flex:1;}
#topbar .user-info{font-size:12px;color:rgba(255,255,255,.7);display:flex;align-items:center;gap:6px;}
#topbar .user-avatar{width:28px;height:28px;border-radius:50%;background:rgba(167,168,151,.35);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;}

/* ── CONTEÚDO ── */
#conteudo{flex:1;overflow:hidden;position:relative;}

/* ── VISTA LISTA ── */
#vista-lista{height:100%;overflow-y:auto;padding:28px 32px;}
.lista-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.lista-header h2{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:var(--verde);}
.lista-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}

/* Card de projeto */
.projeto-card{
  background:#fff;border-radius:var(--radius-lg);padding:20px;
  box-shadow:var(--sombra);border:1px solid rgba(31,62,60,.07);
  cursor:pointer;transition:all .2s;position:relative;
}
.projeto-card:hover{box-shadow:var(--sombra-forte);transform:translateY(-2px);}
.projeto-card .card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;}
.projeto-card .card-nome{font-size:15px;font-weight:700;color:var(--verde);line-height:1.3;}
.projeto-card .card-cliente{font-size:12px;color:var(--texto-suave);margin-top:3px;}
.projeto-card .card-resp{font-size:11px;color:var(--texto-muito-suave);margin-bottom:10px;}
.menu-btn{
  width:28px;height:28px;border-radius:50%;border:none;background:transparent;
  color:var(--texto-suave);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:18px;line-height:1;flex-shrink:0;transition:background .15s;
}
.menu-btn:hover{background:var(--bege-fundo);}
.menu-dropdown{
  position:absolute;right:16px;top:52px;background:#fff;border-radius:8px;
  box-shadow:var(--sombra-forte);border:1px solid rgba(0,0,0,.08);z-index:100;
  min-width:160px;overflow:hidden;display:none;
}
.menu-dropdown.open{display:block;}
.menu-dropdown button{
  width:100%;text-align:left;padding:10px 16px;font-size:13px;font-family:'Nunito',sans-serif;
  background:none;border:none;cursor:pointer;color:var(--texto);transition:background .15s;display:block;
}
.menu-dropdown button:hover{background:var(--fundo);}
.menu-dropdown button.danger{color:var(--erro);}

/* Barra de progresso */
.progress-bar{height:5px;background:var(--bege-fundo);border-radius:99px;overflow:hidden;margin:8px 0 4px;}
.progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--verde-claro),var(--verde));border-radius:99px;transition:width .4s;}
.progress-text{font-size:11px;color:var(--texto-muito-suave);display:flex;justify-content:space-between;align-items:center;}

/* Status badge */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
.badge-verde{background:rgba(45,122,90,.12);color:var(--sucesso);}
.badge-amarelo{background:rgba(212,135,10,.12);color:var(--aviso);}
.badge-vermelho{background:rgba(192,57,43,.1);color:var(--erro);}
.badge-cinza{background:rgba(90,96,96,.1);color:var(--texto-suave);}

/* ── VISTA BOARD ── */
#vista-board{height:100%;display:none;flex-direction:column;}
#vista-board.ativo{display:flex;}

#board-header{
  padding:14px 20px;background:#fff;border-bottom:1px solid rgba(31,62,60,.1);
  display:flex;align-items:center;gap:12px;flex-shrink:0;flex-wrap:wrap;
}
.back-btn{
  display:flex;align-items:center;gap:6px;font-size:13px;color:var(--verde-claro);
  cursor:pointer;background:none;border:none;font-family:'Nunito',sans-serif;font-weight:600;
  padding:6px 10px;border-radius:6px;transition:background .15s;
}
.back-btn:hover{background:var(--fundo);}
.board-projeto-info{flex:1;}
.board-projeto-info h2{font-size:17px;font-weight:700;color:var(--verde);}
.board-projeto-info .sub{font-size:12px;color:var(--texto-suave);}
.board-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.btn{
  padding:7px 14px;border-radius:7px;font-size:12px;font-weight:600;font-family:'Nunito',sans-serif;
  cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:5px;
}
.btn-primary{background:var(--verde);color:#fff;}
.btn-primary:hover{background:var(--verde-medio);}
.btn-outline{background:#fff;color:var(--verde);border:1.5px solid var(--verde);}
.btn-outline:hover{background:var(--fundo);}
.btn-ghost{background:transparent;color:var(--texto-suave);border:1.5px solid rgba(90,96,96,.25);}
.btn-ghost:hover{background:var(--fundo);}
.btn-danger{background:rgba(192,57,43,.08);color:var(--erro);border:1.5px solid rgba(192,57,43,.2);}
.btn-danger:hover{background:rgba(192,57,43,.14);}

/* Colunas Trello */
#board-colunas{
  flex:1;overflow-x:auto;overflow-y:hidden;padding:16px 20px;
  display:flex;gap:14px;align-items:flex-start;
}
.coluna{
  min-width:260px;max-width:280px;background:rgba(31,62,60,.04);
  border-radius:var(--radius-lg);display:flex;flex-direction:column;
  max-height:calc(100vh - 160px);flex-shrink:0;
}
.coluna-header{padding:12px 14px 8px;display:flex;align-items:center;justify-content:space-between;}
.coluna-titulo{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--texto-suave);}
.coluna-count{
  background:rgba(31,62,60,.12);color:var(--verde);width:20px;height:20px;
  border-radius:50%;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
.coluna-cards{
  flex:1;overflow-y:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:8px;min-height:60px;
}
.coluna-cards.drag-over{background:rgba(74,139,134,.08);border-radius:8px;}

/* Card Kanban */
.kanban-card{
  background:#fff;border-radius:9px;padding:12px 13px;
  box-shadow:0 1px 4px rgba(31,62,60,.09);border:1.5px solid transparent;
  cursor:grab;transition:all .2s;user-select:none;
}
.kanban-card:hover{border-color:rgba(31,62,60,.15);box-shadow:0 3px 10px rgba(31,62,60,.13);}
.kanban-card.dragging{opacity:.5;cursor:grabbing;}
.kc-titulo{font-size:13px;font-weight:600;color:var(--verde);line-height:1.4;margin-bottom:6px;}
.kc-meta{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;}
.kc-assignee{font-size:10px;color:var(--texto-suave);}
.kc-prazo{font-size:10px;color:var(--texto-muito-suave);}
.kc-resp{font-size:10px;color:var(--texto-muito-suave);margin-top:4px;}
.kc-badge{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:99px;}
.kc-cliente{background:rgba(212,135,10,.12);color:var(--aviso);}
.kc-equipe{background:rgba(31,62,60,.08);color:var(--verde);}

/* Botão + Adicionar card */
.add-card-btn{
  margin:4px 10px 10px;padding:8px 12px;background:none;border:1.5px dashed rgba(31,62,60,.2);
  border-radius:8px;color:var(--texto-muito-suave);font-size:12px;font-weight:600;
  font-family:'Nunito',sans-serif;cursor:pointer;text-align:left;transition:all .15s;
  display:flex;align-items:center;gap:5px;width:calc(100% - 20px);
}
.add-card-btn:hover{background:rgba(31,62,60,.05);border-color:rgba(31,62,60,.35);color:var(--verde);}

/* ── DRAWER ── */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;display:none;opacity:0;transition:opacity .25s;}
#overlay.show{display:block;opacity:1;}
#drawer{
  position:fixed;top:0;right:0;width:420px;max-width:100vw;height:100vh;
  background:#fff;z-index:201;box-shadow:-4px 0 24px rgba(0,0,0,.15);
  display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
}
#drawer.open{transform:translateX(0);}
#drawer-header{
  padding:16px 18px;border-bottom:1px solid rgba(31,62,60,.1);
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-shrink:0;
}
#drawer-titulo{
  font-size:15px;font-weight:700;color:var(--verde);flex:1;
  border:none;outline:none;background:transparent;font-family:'Nunito',sans-serif;
  line-height:1.4;cursor:text;padding:2px 4px;border-radius:4px;
}
#drawer-titulo:focus{background:var(--fundo);color:var(--verde-medio);}
.drawer-close{
  width:30px;height:30px;border-radius:50%;border:none;background:var(--fundo);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:15px;color:var(--texto-suave);flex-shrink:0;transition:background .15s;
}
.drawer-close:hover{background:var(--bege-fundo);}
#drawer-body{flex:1;overflow-y:auto;padding:16px 18px;}
#drawer-footer{padding:12px 18px;border-top:1px solid rgba(31,62,60,.1);display:flex;justify-content:flex-end;}

.campo-label{font-size:10px;font-weight:700;color:var(--texto-suave);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;display:block;}
.campo-input{
  width:100%;padding:8px 11px;border:1.5px solid rgba(31,62,60,.15);border-radius:7px;
  font-family:'Nunito',sans-serif;font-size:13px;color:var(--texto);background:var(--fundo);
  outline:none;transition:border-color .15s;
}
.campo-input:focus{border-color:var(--verde-claro);}
textarea.campo-input{resize:vertical;min-height:70px;}
.campo-grupo{margin-bottom:12px;}
.campo-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.secao-titulo{font-size:12px;font-weight:700;color:var(--verde);margin:16px 0 8px;display:flex;align-items:center;gap:5px;}

/* Comentários */
.comentario-item{padding:9px 11px;background:var(--fundo);border-radius:7px;margin-bottom:6px;border-left:3px solid transparent;}
.comentario-item.publico{border-left-color:var(--verde-claro);}
.comentario-item.interno{border-left-color:var(--bege);}
.comentario-item.cliente{border-left-color:var(--aviso);}
.comentario-autor{font-size:10px;font-weight:700;color:var(--texto-suave);margin-bottom:2px;display:flex;justify-content:space-between;}
.comentario-texto{font-size:12px;color:var(--texto);line-height:1.5;}
.com-form-area{
  width:100%;padding:8px 11px;border:1.5px solid rgba(31,62,60,.15);border-radius:7px;
  font-family:'Nunito',sans-serif;font-size:12px;color:var(--texto);background:var(--fundo);
  outline:none;resize:none;min-height:56px;transition:border-color .15s;
}
.com-form-area:focus{border-color:var(--verde-claro);}
.com-form-footer{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
.com-form-footer label{font-size:11px;color:var(--texto-suave);display:flex;align-items:center;gap:5px;cursor:pointer;}
.com-form-footer input[type=checkbox]{accent-color:var(--verde);}

/* Docs */
.doc-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--fundo);border-radius:7px;margin-bottom:5px;}
.doc-icon{font-size:15px;flex-shrink:0;}
.doc-info{flex:1;min-width:0;}
.doc-titulo{font-size:12px;font-weight:600;color:var(--verde);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.doc-status{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;}

/* Divider */
.divider{height:1px;background:rgba(31,62,60,.08);margin:12px 0;}

/* ── MODAIS ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-bg.show{display:flex;}
.modal{background:#fff;border-radius:var(--radius-lg);width:100%;max-width:480px;box-shadow:var(--sombra-forte);overflow:hidden;animation:modalIn .2s ease;}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.modal-header{padding:16px 20px;border-bottom:1px solid rgba(31,62,60,.1);display:flex;align-items:center;justify-content:space-between;}
.modal-header h3{font-size:15px;font-weight:700;color:var(--verde);}
.modal-close{width:26px;height:26px;border-radius:50%;border:none;background:var(--fundo);cursor:pointer;font-size:13px;color:var(--texto-suave);display:flex;align-items:center;justify-content:center;}
.modal-body{padding:18px 20px;}
.modal-footer{padding:12px 20px;border-top:1px solid rgba(31,62,60,.08);display:flex;justify-content:flex-end;gap:8px;}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--verde);color:#fff;padding:10px 20px;border-radius:99px;
  font-size:13px;font-weight:600;z-index:500;opacity:0;transition:all .3s;pointer-events:none;
  white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.2);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.erro{background:var(--erro);}

/* Estado vazio */
.empty-state{text-align:center;padding:60px 20px;color:var(--texto-suave);}
.empty-state .icon{font-size:44px;margin-bottom:12px;}
.empty-state h3{font-size:15px;font-weight:600;margin-bottom:6px;}
.empty-state p{font-size:13px;}

/* Loading */
.loading{text-align:center;padding:40px;color:var(--texto-suave);font-size:13px;}
.spinner{width:26px;height:26px;border:3px solid rgba(31,62,60,.15);border-top-color:var(--verde);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px;}
@keyframes spin{to{transform:rotate(360deg)}}

::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(31,62,60,.2);border-radius:99px;}
</style>
</head>
<body>
<div id="app">

  <!-- TOPBAR -->
  <header id="topbar">
    <img src="/logo-cp.png" alt="CP">
    <div class="sep"></div>
    <div class="title">Portal Colaborativo</div>
    <div class="user-info">
      <div class="user-avatar" id="user-avatar">M</div>
      <span id="user-nome">Usuário</span>
    </div>
  </header>

  <div id="conteudo">

    <!-- VISTA LISTA -->
    <div id="vista-lista">
      <div class="lista-header">
        <h2>Projetos</h2>
        <button class="btn btn-primary" onclick="abrirModalProjeto()">+ Novo Projeto</button>
      </div>
      <div id="lista-grid" class="lista-grid">
        <div class="loading"><div class="spinner"></div>Carregando projetos...</div>
      </div>
    </div>

    <!-- VISTA BOARD -->
    <div id="vista-board">
      <div id="board-header">
        <button class="back-btn" onclick="voltarLista()">&#8592; Projetos</button>
        <div class="board-projeto-info">
          <h2 id="board-nome">—</h2>
          <div class="sub" id="board-cliente">—</div>
        </div>
        <div class="board-actions">
          <span id="board-badge" class="badge"></span>
          <button class="btn btn-outline" onclick="abrirModalProjeto(true)">&#9998; Editar</button>
          <button class="btn btn-ghost" onclick="copiarLinkCliente()">&#128203; Link do projeto</button>
          <button class="btn btn-ghost" onclick="copiarLinkAreaCliente()">&#127968; Área do Cliente</button>
          <button class="btn btn-danger" onclick="confirmarExcluirProjetoAtual()">&#128465;</button>
        </div>
      </div>
      <div id="board-colunas"></div>
    </div>

  </div>
</div>

<!-- OVERLAY + DRAWER -->
<div id="overlay" onclick="fecharDrawer()"></div>
<div id="drawer">
  <div id="drawer-header">
    <input type="text" id="drawer-titulo" placeholder="Título do card...">
    <button class="drawer-close" onclick="fecharDrawer()">&#10005;</button>
  </div>
  <div id="drawer-body">
    <div class="campo-row">
      <div class="campo-grupo">
        <label class="campo-label">Status</label>
        <select id="d-status" class="campo-input" onchange="salvarCampo('status',this.value)">
          <option value="pendente">&#128203; A Fazer</option>
          <option value="em_andamento">&#128260; Em Andamento</option>
          <option value="bloqueado">&#8987; Aguard. Cliente</option>
          <option value="concluido">&#10003; Concluído</option>
        </select>
      </div>
      <div class="campo-grupo">
        <label class="campo-label">Atribuído a</label>
        <select id="d-atribuido" class="campo-input" onchange="salvarCampo('atribuido_a',this.value)">
          <option value="equipe">&#128100; Equipe</option>
          <option value="cliente">&#129489; Cliente</option>
        </select>
      </div>
    </div>
    <div class="campo-row">
      <div class="campo-grupo">
        <label class="campo-label">Responsável</label>
        <select id="d-responsavel" class="campo-input" onchange="salvarCampo('responsavel',this.value)">
          <option value="">— nenhum —</option>
          <option value="Mariana Pinheiro">Mariana Pinheiro</option>
          <option value="Diana">Diana</option>
          <option value="Jade">Jade</option>
          <option value="Mariana Barboza">Mariana Barboza</option>
          <option value="Laila Costa">Laila Costa</option>
        </select>
      </div>
      <div class="campo-grupo">
        <label class="campo-label">Prazo</label>
        <input type="date" id="d-prazo" class="campo-input" onchange="salvarCampo('data_conclusao',this.value)">
      </div>
    </div>
    <div class="campo-grupo">
      <label class="campo-label">Descrição</label>
      <textarea id="d-descricao" class="campo-input" rows="3" placeholder="Descreva esta etapa..." onblur="salvarCampo('descricao',this.value)"></textarea>
    </div>

    <div class="divider"></div>
    <div class="secao-titulo">&#9989; Checklist</div>
    <div id="d-checklist-lista" style="margin-bottom:6px"></div>
    <div style="display:flex;gap:6px;margin-top:4px">
      <input id="novo-checklist-item" class="campo-input" placeholder="Adicionar item..." style="flex:1;padding:7px 10px;font-size:12px"
        onkeydown="if(event.key==='Enter'){adicionarChecklistItem();event.preventDefault()}">
      <button class="btn btn-ghost" style="font-size:11px;padding:5px 10px" onclick="adicionarChecklistItem()">+</button>
    </div>

    <div class="divider"></div>
    <div class="secao-titulo">&#128204; Documentos</div>
    <div id="d-docs-lista"></div>
    <button class="btn btn-ghost" style="font-size:11px;margin-top:4px;" onclick="abrirModalDoc()">+ Solicitar documento</button>

    <div class="divider"></div>
    <div class="secao-titulo">&#128172; Comentários</div>
    <div id="d-comentarios-lista"></div>
    <div style="margin-top:8px;">
      <textarea id="novo-comentario" class="com-form-area" placeholder="Adicionar comentário..."></textarea>
      <div class="com-form-footer">
        <label><input type="checkbox" id="comentario-publico"> Visível ao cliente</label>
        <button class="btn btn-primary" style="font-size:11px;padding:5px 11px;" onclick="adicionarComentario()">Comentar</button>
      </div>
    </div>
  </div>
  <div id="drawer-footer">
    <button class="btn btn-danger" onclick="confirmarExcluirCard()">&#128465; Excluir card</button>

</div>

<!-- MODAL PROJETO -->
<div class="modal-bg" id="modal-projeto">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-projeto-titulo">Novo Projeto</h3>

        <label class="campo-label">Nome do Projeto *</label>
        <input type="text" id="mp-nome" class="campo-input" placeholder="Ex: Planejamento Tributário 2025">
      </div>
      <div class="campo-row">
        <div class="campo-grupo">
          <label class="campo-label">Cliente *</label>
          <input type="text" id="mp-cliente" class="campo-input" list="lista-clientes-cp" placeholder="Digite para buscar no cadastro..." oninput="autofillCliente()">
          <datalist id="lista-clientes-cp"></datalist>
          <div id="mp-cliente-status" style="font-size:10px;margin-top:3px;color:var(--texto-muito-suave);"></div>
        </div>
        <div class="campo-grupo">
          <label class="campo-label">E-mail do cliente</label>
          <input type="email" id="mp-email" class="campo-input" placeholder="cliente@email.com">
        </div>
      </div>
      <div class="campo-grupo">
        <label class="campo-label">WhatsApp do cliente</label>
        <input type="tel" id="mp-tel" class="campo-input" placeholder="(71) 99999-9999 — para avisos automáticos de andamento">
      </div>
      <div class="campo-grupo">
        <label class="campo-label">Responsável</label>
        <select id="mp-responsavel" class="campo-input">
          <option value="Mariana Pinheiro">Mariana Pinheiro</option>
          <option value="Diana">Diana</option>
          <option value="Jade">Jade</option>
          <option value="Mariana Barboza">Mariana Barboza</option>
          <option value="Laila Costa">Laila Costa</option>
        </select>
      </div>
      <div class="campo-grupo">
        <label class="campo-label">Descrição</label>

</div>

<!-- MODAL NOVO CARD -->
<div class="modal-bg" id="modal-card">
  <div class="modal" style="max-width:400px;">
    <div class="modal-header">
      <h3>Novo Card</h3>
      <button class="modal-close" onclick="fecharModal('modal-card')">&#10005;</button>
    </div>
    <div class="modal-body">
      <div class="campo-grupo">
        <label class="campo-label">Título *</label>
        <input type="text" id="nc-titulo" class="campo-input" placeholder="O que precisa ser feito?">
      </div>
      <div class="campo-row">
        <div class="campo-grupo">
          <label class="campo-label">Atribuído a</label>
          <select id="nc-atribuido" class="campo-input">
            <option value="equipe">&#128100; Equipe</option>
            <option value="cliente">&#129489; Cliente</option>
          </select>
        </div>
        <div class="campo-grupo">
          <label class="campo-label">Status</label>
          <select id="nc-status" class="campo-input">
            <option value="pendente">A Fazer</option>
            <option value="em_andamento">Em Andamento</option>
            <option value="bloqueado">Aguard. Cliente</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="fecharModal('modal-card')">Cancelar</button>
      <button class="btn btn-primary" onclick="criarCard()">Criar Card</button>
    </div>
  </div>
</div>

<!-- MODAL SOLICITAR DOC -->
<div class="modal-bg" id="modal-doc">
  <div class="modal" style="max-width:400px;">
    <div class="modal-header">
      <h3>Solicitar Documento</h3>
      <button class="modal-close" onclick="fecharModal('modal-doc')">&#10005;</button>
    </div>
    <div class="modal-body">
      <div class="campo-grupo">
        <label class="campo-label">Título *</label>
        <input type="text" id="sd-titulo" class="campo-input" placeholder="Ex: Balancete Fevereiro 2025">
      </div>
      <div class="campo-grupo">
        <label class="campo-label">Instrução ao cliente</label>
        <textarea id="sd-descricao" class="campo-input" rows="2" placeholder="Como o cliente deve enviar..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="fecharModal('modal-doc')">Cancelar</button>
      <button class="btn btn-primary" onclick="criarDoc()">Solicitar</button>
    </div>
  </div>
</div>

<!-- MODAL CONFIRMAR -->
<div class="modal-bg" id="modal-confirmar">
  <div class="modal" style="max-width:380px;">
    <div class="modal-header">
      <h3 id="confirmar-titulo">Confirmar</h3>
      <button class="modal-close" onclick="fecharModal('modal-confirmar')">&#10005;</button>
    </div>
    <div class="modal-body">
      <p id="confirmar-texto" style="font-size:13px;color:var(--texto-suave);line-height:1.6;"></p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="fecharModal('modal-confirmar')">Cancelar</button>
      <button class="btn btn-danger" id="confirmar-btn">Confirmar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── ESTADO ────────────────────────────────────────────────────────────────────
let projetos = [];
let projetoAtual = null;
let etapas = [];
let cardAtual = null;
let novoCardStatus = 'pendente';
let modoEdicaoProjeto = false;

const COLUNAS = [
  { id:'pendente',     icon:'📋', label:'A Fazer',          cor:'#6c7a89' },
  { id:'em_andamento', icon:'🔄', label:'Em Andamento',      cor:'#2e86c1' },
  { id:'bloqueado',    icon:'⏳', label:'Aguardando Cliente', cor:'#d68910' },
  { id:'concluido',    icon:'✅', label:'Concluído',          cor:'#1e8449' },
];

// ── INIT ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  if (window.CP_USER) {
    const n = window.CP_USER.nome || window.CP_USER.username || 'Usuário';
    document.getElementById('user-nome').textContent = n;
    document.getElementById('user-avatar').textContent = n.charAt(0).toUpperCase();
  }
  carregarProjetos();

  document.getElementById('drawer-titulo').addEventListener('blur', function() {
    if (cardAtual) salvarCampo('titulo', this.value.trim());
  });
  document.getElementById('drawer-titulo').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); this.blur(); }
  });
});

// ── TOAST ─────────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, tipo) {
  clearTimeout(toastTimer);
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (tipo ? ' ' + tipo : '');
  toastTimer = setTimeout(() => { el.className = ''; }, 3000);
}

// ── MODAIS ────────────────────────────────────────────────────────────────────
function abrirModal(id) { document.getElementById(id).classList.add('show'); }
function fecharModal(id) { document.getElementById(id).classList.remove('show'); }

function confirmar(titulo, texto, cb) {
  document.getElementById('confirmar-titulo').textContent = titulo;
  document.getElementById('confirmar-texto').textContent = texto;
  const btn = document.getElementById('confirmar-btn');
  btn.onclick = () => { fecharModal('modal-confirmar'); cb(); };
  abrirModal('modal-confirmar');
}

// ── PROJETOS — LISTA ──────────────────────────────────────────────────────────
async function carregarProjetos() {
  try {
    projetos = await DB.get('projetos_cp', 'order=criado_em.desc');
    renderizarLista();
  } catch(e) {
    document.getElementById('lista-grid').innerHTML =
      `<div class="empty-state" style="grid-column:1/-1"><div class="icon">⚠️</div><h3>Erro ao carregar</h3><p>${esc(e.message||'Tente novamente')}</p></div>`;
  }
}

async function renderizarLista() {
  const grid = document.getElementById('lista-grid');
  if (!projetos.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="icon">📁</div><h3>Nenhum projeto ainda</h3><p>Clique em "+ Novo Projeto" para começar.</p></div>`;
    return;
  }
  // Buscar progresso de cada projeto (etapas concluídas / total)
  grid.innerHTML = projetos.map(p => {
    const prog = typeof p._prog === 'number' ? p._prog : 0;
    return `
    <div class="projeto-card" id="card-proj-${p.id}" onclick="abrirBoard('${p.id}')">
      <div class="card-header">
        <div>
          <div class="card-nome">${esc(p.nome)}</div>
          <div class="card-cliente">👤 ${esc(p.cliente_nome||'—')}</div>
        </div>
        <button class="menu-btn" onclick="event.stopPropagation();toggleMenu(event,'menu-${p.id}')">⋮</button>
        <div class="menu-dropdown" id="menu-${p.id}">
          <button onclick="event.stopPropagation();fecharMenus();abrirBoard('${p.id}')">Abrir</button>
          <button onclick="event.stopPropagation();fecharMenus();copiarLinkClienteDe('${p.token_acesso||''}')">Copiar link do cliente</button>
          <button class="danger" onclick="event.stopPropagation();fecharMenus();excluirProjetoId('${p.id}')">Excluir</button>
        </div>
      </div>
      <div class="card-resp">👤 ${esc(p.responsavel||'Sem responsável')}</div>
      <div class="progress-bar"><div class="fill" style="width:${prog}%"></div></div>
      <div class="progress-text"><span>${prog}% concluído</span><span class="${badgeClass(p.status)}">${labelStatus(p.status)}</span></div>
      ${p._avaliacao && p._avaliacao.nota ? `<div style="font-size:11px;margin-top:6px;color:#d4870a;" title="Avaliação do cliente">${'⭐'.repeat(Math.min(5,p._avaliacao.nota))} Avaliação do cliente</div>` : ''}
      ${p._avaliacao_nota ? `<div style="font-size:11px;margin-top:6px;color:#d4870a;">${'⭐'.repeat(Math.min(5,p._avaliacao_nota))}</div>` : ''}
    </div>`;
  }).join('');
}

function badgeClass(s) {
  const m = {ativo:'badge badge-verde',concluido:'badge badge-verde',em_andamento:'badge badge-amarelo',pendente:'badge badge-cinza',cancelado:'badge badge-vermelho'};
  return m[s]||'badge badge-cinza';
}
function labelStatus(s) {
  const m = {ativo:'Ativo',concluido:'Concluído',em_andamento:'Em andamento',pendente:'Pendente',cancelado:'Cancelado'};
  return m[s]||s||'Ativo';
}

function toggleMenu(e, id) {
  e.stopPropagation();
  const aberto = document.getElementById(id).classList.contains('open');
  fecharMenus();
  if (!aberto) document.getElementById(id).classList.add('open');
}
function fecharMenus() {
  document.querySelectorAll('.menu-dropdown.open').forEach(m => m.classList.remove('open'));
}

// ── MODAL PROJETO ─────────────────────────────────────────────────────────────
function abrirModalProjeto(edicao = false) {
  modoEdicaoProjeto = edicao;
  document.getElementById('modal-projeto-titulo').textContent = edicao ? 'Editar Projeto' : 'Novo Projeto';
  _clienteSelecionadoId = null;
  if (edicao && projetoAtual) {
    document.getElementById('mp-nome').value        = projetoAtual.nome||'';
    document.getElementById('mp-cliente').value     = projetoAtual.cliente_nome||'';
    document.getElementById('mp-email').value       = projetoAtual.cliente_email||'';
    document.getElementById('mp-tel').value         = projetoAtual.cliente_telefone||'';
    document.getElementById('mp-responsavel').value = projetoAtual.responsavel||'Mariana Pinheiro';
    document.getElementById('mp-descricao').value   = projetoAtual.descricao||'';
    if (projetoAtual.cliente_id) _clienteSelecionadoId = projetoAtual.cliente_id;
  } else {
    ['mp-nome','mp-cliente','mp-email','mp-tel','mp-descricao'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('mp-responsavel').value='Mariana Pinheiro';
    const st = document.getElementById('mp-cliente-status');
    if (st) st.textContent = '';
  }
  abrirModal('modal-projeto');
}

async function salvarProjeto() {
  const nome    = document.getElementById('mp-nome').value.trim();
  const cliente = document.getElementById('mp-cliente').value.trim();
  if (!nome||!cliente) { toast('Preencha nome e cliente','erro'); return; }

  const dados = {
    nome,
    cliente_nome:     cliente,
    cliente_email:    document.getElementById('mp-email').value.trim(),
    cliente_telefone: document.getElementById('mp-tel').value.trim(),
    responsavel:      document.getElementById('mp-responsavel').value,
    descricao:        document.getElementById('mp-descricao').value.trim(),
  };
  if (_clienteSelecionadoId) dados.cliente_id = _clienteSelecionadoId;

  try {
    if (modoEdicaoProjeto && projetoAtual) {
      await DB.update('projetos_cp',`id=eq.${projetoAtual.id}`,dados);
      Object.assign(projetoAtual,dados);
      document.getElementById('board-nome').textContent = dados.nome;
      document.getElementById('board-cliente').textContent = '👤 '+dados.cliente_nome;
      toast('Projeto atualizado');
    } else {
      dados.token_acesso = 'tk_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);
      dados.status = 'ativo';
      const novo = await DB.insert('projetos_cp',dados);
      if (novo&&novo[0]) projetos.unshift(novo[0]);
      renderizarLista();
      toast('Projeto criado');
    }
    fecharModal('modal-projeto');
  } catch(e) { toast('Erro: '+(e.message||'tente novamente'),'erro'); }
}

// ── BOARD ─────────────────────────────────────────────────────────────────────
async function abrirBoard(id) {
  projetoAtual = projetos.find(p=>p.id===id);
  if (!projetoAtual) return;

  document.getElementById('vista-lista').style.display='none';
  document.getElementById('vista-board').classList.add('ativo');
  document.getElementById('board-nome').textContent = projetoAtual.nome;
  document.getElementById('board-cliente').textContent = '👤 '+(projetoAtual.cliente_nome||'—');
  const badge = document.getElementById('board-badge');
  badge.className = badgeClass(projetoAtual.status);
  badge.textContent = labelStatus(projetoAtual.status);

  await carregarBoard();
}

async function carregarBoard() {
  const container = document.getElementById('board-colunas');
  container.innerHTML = '<div class="loading"><div class="spinner"></div>Carregando...</div>';
  try {
    etapas = await DB.get('projetos_etapas',`projeto_id=eq.${projetoAtual.id}&order=ordem.asc`);
    renderizarBoard();
  } catch(e) { toast('Erro ao carregar etapas','erro'); }
}

function renderizarBoard() {
  const container = document.getElementById('board-colunas');
  container.innerHTML = COLUNAS.map(col => {
    const cards = etapas.filter(e=>e.status===col.id);
    return `
    <div class="coluna">
      <div class="coluna-header">
        <span class="coluna-titulo" style="color:${col.cor}">${col.icon} ${col.label}</span>
        <span class="coluna-count">${cards.length}</span>
      </div>
      <div class="coluna-cards" id="col-${col.id}" data-status="${col.id}"
           ondragover="dragOver(event)" ondrop="drop(event,this)" ondragleave="dragLeave(event)">
        ${cards.map(renderKanbanCard).join('')}
      </div>
      <button class="add-card-btn" onclick="abrirModalCard('${col.id}')">＋ Adicionar card</button>
    </div>`;
  }).join('');
}

function renderKanbanCard(c) {
  const ehCliente = c.atribuido_a==='cliente';
  const prazo = c.data_conclusao
    ? new Date(c.data_conclusao+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})
    : '';
  return `
  <div class="kanban-card" id="kc-${c.id}" draggable="true"
       ondragstart="dragStart(event,'${c.id}')" ondragend="dragEnd(event)"
       onclick="abrirDrawer('${c.id}')">
    <div class="kc-titulo">${esc(c.titulo)}</div>
    <div class="kc-meta">
      <span class="kc-badge ${ehCliente?'kc-cliente':'kc-equipe'}">${ehCliente?'🧑 Cliente':'👤 Equipe'}</span>
      ${prazo?`<span class="kc-prazo">📅 ${prazo}</span>`:''}
    </div>
    ${c.responsavel?`<div class="kc-resp">${esc(c.responsavel)}</div>`:''}
  </div>`;
}

function voltarLista() {
  document.getElementById('vista-board').classList.remove('ativo');
  document.getElementById('vista-lista').style.display='';
  fecharDrawer();
  projetoAtual=null; etapas=[];
  carregarProjetos();
}

// ── DRAG & DROP ───────────────────────────────────────────────────────────────
let draggingId = null;

function dragStart(e,id) {
  draggingId=id;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
}
function dragEnd(e) { e.currentTarget.classList.remove('dragging'); draggingId=null; }
function dragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function dragLeave(e) { if(!e.currentTarget.contains(e.relatedTarget)) e.currentTarget.classList.remove('drag-over'); }

async function drop(e, col) {
  e.preventDefault();
  col.classList.remove('drag-over');
  if (!draggingId) return;

  const novoStatus = col.dataset.status;
  const etapa = etapas.find(et=>et.id===draggingId);
  if (!etapa||etapa.status===novoStatus) return;

  const antigo = etapa.status;
  etapa.status = novoStatus;
  renderizarBoard();
  try {
    await DB.update('projetos_etapas',`id=eq.${etapa.id}`,{status:novoStatus});
    toast('Card movido');
  } catch(err) {
    etapa.status=antigo;
    renderizarBoard();
    toast('Erro ao mover','erro');
  }
}

// ── DRAWER ────────────────────────────────────────────────────────────────────
async function abrirDrawer(id) {
  cardAtual = etapas.find(e=>e.id===id);
  if (!cardAtual) return;

  document.getElementById('drawer-titulo').value   = cardAtual.titulo||'';
  document.getElementById('d-status').value        = cardAtual.status||'pendente';
  document.getElementById('d-atribuido').value     = cardAtual.atribuido_a||'equipe';
  document.getElementById('d-responsavel').value   = cardAtual.responsavel||'';
  document.getElementById('d-prazo').value         = cardAtual.data_conclusao?cardAtual.data_conclusao.slice(0,10):'';
  document.getElementById('d-descricao').value     = cardAtual.descricao||'';

  document.getElementById('overlay').classList.add('show');
  document.getElementById('drawer').classList.add('open');
  carregarChecklist();

  carregarDocs();
  carregarComentarios();
}

function fecharDrawer() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('drawer').classList.remove('open');
  cardAtual=null;
}

async function salvarCampo(campo, valor) {
  if (!cardAtual) return;
  cardAtual[campo]=valor;
  try {
    await DB.update('projetos_etapas',`id=eq.${cardAtual.id}`,{[campo]:valor});
    if (campo==='status'||campo==='titulo'||campo==='atribuido_a') renderizarBoard();
  } catch(e) { toast('Erro ao salvar','erro'); }
}

// ── DOCS ──────────────────────────────────────────────────────────────────────
async function carregarDocs() {
  const lista = document.getElementById('d-docs-lista');
  lista.innerHTML = '<div style="font-size:11px;color:var(--texto-muito-suave);">Carregando...</div>';
  try {
    const docs = await DB.get('projetos_docs',`projeto_id=eq.${projetoAtual.id}&etapa_id=eq.${cardAtual.id}`);
    if (!docs.length) { lista.innerHTML='<div style="font-size:12px;color:var(--texto-muito-suave);">Nenhum documento.</div>'; return; }
    const corStatus = { solicitado:'var(--aviso)', recebido:'var(--sucesso)', pendente:'var(--bege)' };
    lista.innerHTML = docs.map(d=>`
      <div class="doc-item">
        <span class="doc-icon">📄</span>
        <div class="doc-info">
          <div class="doc-titulo">${esc(d.titulo)}</div>
          <div class="doc-status" style="color:${corStatus[d.status]||'var(--bege)'}">${esc(d.status||'pendente')}</div>
          ${d.arquivo_path ? `<button onclick="verArquivo('${esc(d.arquivo_path)}')" style="margin-top:4px;font-size:10px;font-weight:600;color:var(--verde-claro);background:none;border:none;cursor:pointer;padding:0;font-family:'Nunito',sans-serif;">Ver arquivo ↗</button>` : ''}
        </div>
      </div>`).join('');
  } catch(e) { lista.innerHTML='<div style="color:var(--erro);font-size:12px;">Erro ao carregar.</div>'; }
}

function abrirModalDoc() {
  document.getElementById('sd-titulo').value='';
  document.getElementById('sd-descricao').value='';
  abrirModal('modal-doc');
}

async function criarDoc() {
  const titulo = document.getElementById('sd-titulo').value.trim();
  if (!titulo) { toast('Informe o título','erro'); return; }
  try {
    await DB.insert('projetos_docs',{
      projeto_id: projetoAtual.id,
      etapa_id: cardAtual.id,
      titulo,
      descricao: document.getElementById('sd-descricao').value.trim(),
      status: 'solicitado',
    });
    fecharModal('modal-doc');
    toast('Documento solicitado');
    carregarDocs();
  } catch(e) { toast('Erro: '+(e.message||''),'erro'); }
}

// ── COMENTÁRIOS ───────────────────────────────────────────────────────────────
async function carregarComentarios() {
  const lista = document.getElementById('d-comentarios-lista');
  lista.innerHTML = '<div style="font-size:11px;color:var(--texto-muito-suave);">Carregando...</div>';
  try {
    const logs = await DB.get('projetos_logs',`projeto_id=eq.${projetoAtual.id}&etapa_id=eq.${cardAtual.id}&order=criado_em.asc`);
    if (!logs.length) { lista.innerHTML='<div style="font-size:12px;color:var(--texto-muito-suave);margin-bottom:6px;">Nenhum comentário.</div>'; return; }
    lista.innerHTML = logs.map(l=>{
      const data = l.criado_em ? new Date(l.criado_em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
      const tipoLabel = {publico:'Público',interno:'Interno',cliente:'Cliente'}[l.tipo]||'Interno';
      return `<div class="comentario-item ${l.tipo||'interno'}">
        <div class="comentario-autor">
          <span>${esc(l.autor||'Equipe')}</span>
          <span style="font-weight:400;color:var(--texto-muito-suave);">${tipoLabel} · ${data}</span>
        </div>
        <div class="comentario-texto">${esc(l.texto)}</div>
      </div>`;
    }).join('');
  } catch(e) { lista.innerHTML='<div style="color:var(--erro);font-size:12px;">Erro.</div>'; }
}

async function adicionarComentario() {
  const texto = document.getElementById('novo-comentario').value.trim();
  if (!texto) return;
  const publico = document.getElementById('comentario-publico').checked;
  const autor = window.CP_USER ? (window.CP_USER.nome||window.CP_USER.username) : 'Equipe';
  try {
    await DB.insert('projetos_logs',{
      projeto_id: projetoAtual.id,
      etapa_id: cardAtual.id,
      texto, autor,
      tipo: publico ? 'publico' : 'interno',
    });
    document.getElementById('novo-comentario').value='';
    document.getElementById('comentario-publico').checked=false;
    await carregarComentarios();
    toast('Comentário adicionado');
  } catch(e) { toast('Erro ao comentar','erro'); }
}

// ── NOVO CARD ─────────────────────────────────────────────────────────────────
function abrirModalCard(status) {
  novoCardStatus = status;
  document.getElementById('nc-titulo').value='';
  document.getElementById('nc-atribuido').value='equipe';
  document.getElementById('nc-status').value=status;
  abrirModal('modal-card');
}

async function criarCard() {
  const titulo = document.getElementById('nc-titulo').value.trim();
  if (!titulo) { toast('Informe o título','erro'); return; }
  const status  = document.getElementById('nc-status').value;
  const maxOrd  = etapas.filter(e=>e.status===status).reduce((m,e)=>Math.max(m,e.ordem||0),0);
  try {
    const novo = await DB.insert('projetos_etapas',{
      projeto_id: projetoAtual.id,
      titulo, status,
      atribuido_a: document.getElementById('nc-atribuido').value,
      ordem: maxOrd+1,
    });
    if (novo&&novo[0]) etapas.push(novo[0]);
    renderizarBoard();
    fecharModal('modal-card');
    toast('Card criado');
  } catch(e) { toast('Erro: '+(e.message||''),'erro'); }
}

// ── EXCLUIR ───────────────────────────────────────────────────────────────────
function confirmarExcluirCard() {
  if (!cardAtual) return;
  confirmar('Excluir card',`Deseja excluir "${cardAtual.titulo}"? Esta ação é irreversível.`, async () => {
    try {
      await DB.delete('projetos_etapas',`id=eq.${cardAtual.id}`);
      etapas = etapas.filter(e=>e.id!==cardAtual.id);
      fecharDrawer();
      renderizarBoard();
      toast('Card excluído');
    } catch(e) { toast('Erro ao excluir','erro'); }
  });
}

function confirmarExcluirProjetoAtual() {
  if (!projetoAtual) return;
  confirmar('Excluir projeto',`Deseja excluir "${projetoAtual.nome}"? Todas as etapas e documentos serão removidos.`, async () => {
    try {
      await DB.delete('projetos_cp',`id=eq.${projetoAtual.id}`);
      projetos = projetos.filter(p=>p.id!==projetoAtual.id);
      voltarLista();
      toast('Projeto excluído');
    } catch(e) { toast('Erro ao excluir','erro'); }
  });
}

function excluirProjetoId(id) {
  const p = projetos.find(x=>x.id===id);
  if (!p) return;
  confirmar('Excluir projeto',`Deseja excluir "${p.nome}"?`, async () => {
    try {
      await DB.delete('projetos_cp',`id=eq.${id}`);
      projetos = projetos.filter(x=>x.id!==id);
      renderizarLista();
      toast('Projeto excluído');
    } catch(e) { toast('Erro ao excluir','erro'); }
  });
}

// ── LINK CLIENTE ──────────────────────────────────────────────────────────────
function copiarLinkCliente() {
  if (!projetoAtual) return;
  copiarLinkClienteDe(projetoAtual.token_acesso);
}
function copiarLinkClienteDe(token) {
  if (!token) { toast('Projeto sem token','erro'); return; }
  const url = `${location.origin}/portal.html?token=${token}`;
  navigator.clipboard.writeText(url).then(()=>toast('Link copiado!')).catch(()=>toast('Erro ao copiar','erro'));
}

// ── CHAMADA AUTENTICADA GENÉRICA (action) ────────────────────────────────────
async function dbAction(payload) {
  const raw = sessionStorage.getItem('cp_user');
  const user = raw ? JSON.parse(raw) : null;
  const r = await fetch('/api/db', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      ...(user && user.session_token ? { 'x-session-token': user.session_token } : {})
    },
    body: JSON.stringify(payload)
  });
  return r.json();
}

// ── ÁREA DO CLIENTE — gerar link e copiar ─────────────────────────────────────
async function copiarLinkAreaCliente() {
  if (!projetoAtual) return;
  const clienteId = projetoAtual.cliente_id;
  if (!clienteId) {
    toast('Projeto sem cliente vinculado. Edite o projeto e selecione o cliente pelo autocomplete.','erro');
    return;
  }
  try {
    const r = await dbAction({ action: 'portal_cliente_link', cliente_id: clienteId });
    if (r.erro) throw new Error(r.erro);
    navigator.clipboard.writeText(r.link)
      .then(()=>toast('Link da Área do Cliente copiado!'))
      .catch(()=>{ prompt('Copie o link:', r.link); });
  } catch(e) {
    toast('Erro: ' + (e.message||'tente novamente'),'erro');
  }
}

// ── VER ARQUIVO DO CLIENTE ────────────────────────────────────────────────────
async function verArquivo(path) {
  if (!path) return;
  try {
    const r = await dbAction({ action: 'arquivo_url', path });
    if (r.erro) throw new Error(r.erro);
    if (r.url) window.open(r.url, '_blank');
  } catch(e) {
    toast('Erro ao gerar link do arquivo: ' + (e.message||''),'erro');
  }
}

// ── AUTOCOMPLETE DE CLIENTES NO MODAL PROJETO ─────────────────────────────────
let _clienteDebounce = null;
let _clienteSelecionadoId = null;

async function autofillCliente() {
  const input = document.getElementById('mp-cliente');
  const datalist = document.getElementById('lista-clientes-cp');
  const status = document.getElementById('mp-cliente-status');
  const q = input.value.trim();

  // Limpar seleção se o usuário apagou
  _clienteSelecionadoId = null;
  if (status) status.textContent = '';

  clearTimeout(_clienteDebounce);
  if (q.length < 2) { datalist.innerHTML = ''; return; }

  _clienteDebounce = setTimeout(async () => {
    try {
      const clientes = await DB.get('clientes', `nome=ilike.*${encodeURIComponent(q)}*&select=id,nome,contato,email&limit=10&order=nome.asc`);
      datalist.innerHTML = clientes.map(c =>
        `<option value="${esc(c.nome)}" data-id="${c.id}" data-tel="${esc(c.contato||'')}" data-email="${esc(c.email||'')}">`
      ).join('');
      // Checar se o valor digitado bate exatamente com algum resultado
      verificarSelecaoCliente(clientes);
    } catch(e) { /* silencioso */ }
  }, 300);
}

function verificarSelecaoCliente(clientes) {
  const input = document.getElementById('mp-cliente');
  const val = input.value.trim();
  const match = (clientes||[]).find(c => c.nome === val);
  if (match) selecionarClienteMatch(match);
}

function selecionarClienteMatch(c) {
  _clienteSelecionadoId = c.id;
  const status = document.getElementById('mp-cliente-status');
  if (status) status.textContent = 'Cliente vinculado ao cadastro.';

  // Preencher telefone e e-mail se estiverem vazios
  const telInput = document.getElementById('mp-tel');
  const emailInput = document.getElementById('mp-email');
  if (telInput && !telInput.value && c.contato) telInput.value = c.contato;
  if (emailInput && !emailInput.value && c.email) emailInput.value = c.email;
}

// Detectar seleção via datalist (change no input)
document.addEventListener('DOMContentLoaded', () => {
  const mpCliente = document.getElementById('mp-cliente');
  if (mpCliente) {
    mpCliente.addEventListener('change', async () => {
      const val = mpCliente.value.trim();
      if (!val) return;
      // Buscar pelo nome exato para obter o id
      try {
        const r = await DB.get('clientes', `nome=eq.${encodeURIComponent(val)}&select=id,nome,contato,email&limit=1`);
        if (r && r.length) selecionarClienteMatch(r[0]);
      } catch(e) {}
    });
  }
});

// ── UTILS ─────────────────────────────────────────────────────────────────────
function esc(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── CHECKLIST ──────────────────────────────────────────────────────
async function carregarChecklist() {
  const lista = document.getElementById('d-checklist-lista');
  if (!cardAtual) return;
  try {
    const items = await DB.get('projetos_checklist', `etapa_id=eq.${cardAtual.id}&order=ordem.asc`);
    if (!items.length) { lista.innerHTML = '<div style="font-size:12px;color:var(--texto-muito-suave)">Nenhum item.</div>'; return; }
    const total = items.length, conc = items.filter(i => i.concluido).length;
    const pct = Math.round(conc / total * 100);
    lista.innerHTML = `
      <div style="margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--texto-muito-suave);margin-bottom:3px">
          <span>${conc} de ${total}</span><span>${pct}%</span>
        </div>
        <div style="height:4px;background:var(--bege-fundo);border-radius:99px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:var(--verde-claro);border-radius:99px;transition:.3s"></div>
        </div>
      </div>
      ${items.map(item => `
        <div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(31,62,60,.05)">
          <input type="checkbox" ${item.concluido ? 'checked' : ''} onchange="toggleChecklist('${item.id}',this.checked)"
            style="width:15px;height:15px;accent-color:var(--verde);cursor:pointer;flex-shrink:0">
          <span style="flex:1;font-size:12px;color:var(--texto);${item.concluido ? 'text-decoration:line-through;opacity:.5' : ''}">${esc(item.texto)}</span>
          <button onclick="excluirChecklistItem('${item.id}')" style="background:none;border:none;color:var(--texto-muito-suave);cursor:pointer;font-size:14px;line-height:1;padding:0 2px" title="Remover">×</button>
        </div>`).join('')}`;
  } catch(e) { lista.innerHTML = '<div style="color:var(--erro);font-size:12px">Erro ao carregar.</div>'; }
}

async function adicionarChecklistItem() {
  const input = document.getElementById('novo-checklist-item');
  const texto = input.value.trim();
  if (!texto || !cardAtual) return;
  try {
    await DB.insert('projetos_checklist', { etapa_id: cardAtual.id, texto, concluido: false, ordem: 99 });
    input.value = '';
    await carregarChecklist();
  } catch(e) { alert('Erro ao adicionar item.'); }
}

async function toggleChecklist(id, concluido) {
  try { await DB.update('projetos_checklist', `id=eq.${id}`, { concluido }); await carregarChecklist(); }
  catch(e) { console.error(e); }
}

async function excluirChecklistItem(id) {
  try { await DB.delete('projetos_checklist', `id=eq.${id}`); await carregarChecklist(); }
  catch(e) { console.error(e); }
}

document.addEventListener('click', e => {
  if (!e.target.closest('.menu-btn') && !e.target.closest('.menu-dropdown')) fecharMenus();
});
