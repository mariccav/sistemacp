<!-- Shader WebGL (DNA) -->
<div class="fixed inset-0 w-full h-full -z-10">
<canvas id="shader-canvas-DNA" style="display:block;width:100%;height:100%"></canvas>
<script>
(function(){
  const canvas=document.getElementById('shader-canvas-DNA');
  function syncSize(){const w=canvas.clientWidth||1280,h=canvas.clientHeight||720;if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}}
  if(typeof ResizeObserver!=='undefined')new ResizeObserver(syncSize).observe(canvas);
  syncSize();
  const gl=canvas.getContext('webgl')||canvas.getContext('experimental-webgl');if(!gl)return;
  const vs=`attribute vec2 a_position;varying vec2 v_texCoord;void main(){v_texCoord=a_position*0.5+0.5;gl_Position=vec4(a_position,0.0,1.0);}`;
  const fs=`precision highp float;uniform float u_time;uniform vec2 u_resolution;varying vec2 v_texCoord;
void main(){
  vec2 uv=v_texCoord;vec2 p=(uv-0.5)*2.0;p.x*=u_resolution.x/u_resolution.y;
  float t=u_time*0.3;float s=sin(t*0.1);float c=cos(t*0.1);p=mat2(c,-s,s,c)*p;
  float helix=0.0;
  for(float i=0.0;i<2.0;i++){
    float offset=i*3.14159;
    float x=p.x+sin(p.y*2.5+u_time*0.8+offset)*0.35;
    float line=smoothstep(0.06,0.0,abs(x));
    float steps=smoothstep(0.04,0.0,abs(sin(p.y*10.0+u_time*0.4)))*step(abs(p.x),0.35);
    helix+=line*0.7+steps*0.4;
  }
  vec3 color1=vec3(0.0,0.08,0.06);vec3 color2=vec3(0.89,0.75,0.60);
  float mask=smoothstep(1.0,0.2,length(p*0.7));
  vec3 finalColor=mix(color1,color2,helix*mask*0.5);
  finalColor+=color2*(0.05*sin(u_time)+0.05)*helix*mask;
  gl_FragColor=vec4(finalColor,1.0);
}`;
  function cs(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s;}
  const prog=gl.createProgram();
  gl.attachShader(prog,cs(gl.VERTEX_SHADER,vs));
  gl.attachShader(prog,cs(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(prog);gl.useProgram(prog);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const pos=gl.getAttribLocation(prog,'a_position');
  gl.enableVertexAttribArray(pos);gl.vertexAttribPointer(pos,2,gl.FLOAT,false,0,0);
  const uTime=gl.getUniformLocation(prog,'u_time');
  const uRes=gl.getUniformLocation(prog,'u_resolution');
  function render(t){gl.viewport(0,0,canvas.width,canvas.height);if(uTime)gl.uniform1f(uTime,t*0.001);if(uRes)gl.uniform2f(uRes,canvas.width,canvas.height);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(render);}
  render(0);
})();
</script>

<!-- FORMULÁRIO DE LOGIN (modal) -->
<div class="login-form" id="login-form">
  <div class="login-card" style="position:relative">
    <button class="btn-fechar" onclick="fecharLogin()">✕</button>
    <div style="text-align:center;margin-bottom:28px;">
      <img src="/logo-cp.png" style="height:36px;width:auto;filter:brightness(0) invert(1);opacity:.8;margin:0 auto 16px;">
      <div style="font-family:'Playfair Display',serif;font-size:20px;font-weight:600;color:#c7eadd;">Acesso ao Sistema</div>
      <div style="font-size:11px;color:rgba(193,200,195,.5);margin-top:4px;letter-spacing:2px;text-transform:uppercase;">Cavalcante Pinheiro Advocacia</div>
    </div>
    <div id="login-erro" class="login-erro"></div>
    <div style="margin-bottom:16px;">
      <label class="login-label">Usuário</label>
      <input type="text" id="username" class="login-input" placeholder="seu.usuario" autocomplete="username" onkeydown="if(event.key==='Enter')entrar()">
    </div>
    <div style="margin-bottom:20px;">
      <label class="login-label">Senha</label>
      <input type="password" id="senha" class="login-input" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrar()">
    </div>
    <button class="login-btn" id="btn-login" onclick="entrar()">ENTRAR</button>
  </div>
</div>

<script>
// Verificar se já está logado
const existente = sessionStorage.getItem('cp_user');
if (existente) {
  try {
    const u = JSON.parse(existente);
    if (u.logged_at && Date.now() - u.logged_at < 12 * 3600 * 1000) {
      window.location.href = '/dashboard.html';
    }
  } catch {}
}

function abrirLogin() {
  document.getElementById('login-form').classList.add('show');
  setTimeout(() => document.getElementById('username').focus(), 100);
}
function fecharLogin() {
  document.getElementById('login-form').classList.remove('show');
}

// Fechar ao clicar fora
document.getElementById('login-form').addEventListener('click', e => {
  if (e.target === document.getElementById('login-form')) fecharLogin();
});

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function entrar() {
  const username = document.getElementById('username').value.trim().toLowerCase();
  const senha    = document.getElementById('senha').value;
  const btn      = document.getElementById('btn-login');
  const erro     = document.getElementById('login-erro');

  if (!username || !senha) { mostrarErro('Preencha usuário e senha.'); return; }
  btn.textContent = 'VERIFICANDO...'; btn.disabled = true; erro.style.display = 'none';

  try {
    const hash = await sha256(senha);
    const r = await fetch(
      `https://svwwmxapmppjkmbazhul.supabase.co/rest/v1/usuarios?username=eq.${encodeURIComponent(username)}&senha_hash=eq.${hash}&ativo=eq.true&select=*`,
      { headers: { 'apikey': 'sb_publishable_7Hk2szDWhQAB7X4cPK75ow_va8f5MJw', 'Authorization': 'Bearer sb_publishable_7Hk2szDWhQAB7X4cPK75ow_va8f5MJw' } }
    );
    const dados = r.ok ? await r.json() : [];
    if (!dados.length) { mostrarErro('Usuário ou senha incorretos.'); return; }
    const u = dados[0];
    sessionStorage.setItem('cp_user', JSON.stringify({ id:u.id, username:u.username, nome:u.nome, cargo:u.cargo, ini:u.ini, cor:u.cor, is_admin:u.is_admin, logged_at:Date.now() }));
    const params = new URLSearchParams(window.location.search);
    window.location.href = params.get('next') || '/dashboard.html';
  } catch { mostrarErro('Erro de conexão. Tente novamente.'); }
  finally { btn.textContent = 'ENTRAR'; btn.disabled = false; }
}

function mostrarErro(msg) {
  const e = document.getElementById('login-erro');
  e.textContent = msg; e.style.display = 'block';
}

// Parallax nas texturas
document.addEventListener('mousemove', e => {
  const x = (window.innerWidth/2 - e.pageX) / 100;
  const y = (window.innerHeight/2 - e.pageY) / 100;
  document.querySelectorAll('.office-texture').forEach(t => {
    t.style.transform = `translate(${x}px,${y}px) scale(1.05)`;
  });
});
</script>
